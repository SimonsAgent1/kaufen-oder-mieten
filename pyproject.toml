[project]
name = "buy-vs-rent"
version = "0.1.35"
description = "Kauf oder Miete für ein Leben in Deutschland"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "pydantic>=2.9", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
buy-vs-rent = "buy_vs_rent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "buy_vs_rent" = "src/backend" }
packages = ["buy_vs_rent", "buy_vs_rent.law"]

[tool.setuptools.package-data]
buy_vs_rent = ["profile.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
