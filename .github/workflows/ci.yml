name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          cp private/profile.example.yaml src/backend/profile.example.yaml
          pip install -e ".[dev]"
          pytest tests -q
          bash scripts/git-leak-check.sh
